<title>Meal Prep — Plano de Refeições</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4EFE3;--paper-2:#FBF8F0;--ink:#211F1A;--ink-soft:#6B6558;
    --herb:#2F6B4A;--herb-deep:#234f37;--amber:#C68A2E;--line:#E2DAC7;
    --line-soft:#EBE4D4;--shadow:rgba(33,31,26,.08);--cold:#3f7fa6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);
    line-height:1.4;padding:0 0 80px;
    background-image:radial-gradient(var(--line-soft) 1px,transparent 1px);background-size:22px 22px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
  header{padding:30px 0 16px;border-bottom:2px solid var(--ink);margin-bottom:20px;position:relative}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .mark{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(32px,5.5vw,50px);letter-spacing:-.02em;line-height:.95}
  .mark em{font-style:italic;color:var(--herb)}
  .tag{font-size:12px;color:var(--ink-soft);font-weight:500;text-transform:uppercase;letter-spacing:.14em}

  .setup{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
  .setup label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-soft)}
  .setup input[type=date]{border:1.5px solid var(--ink);background:var(--paper-2);border-radius:10px;
    padding:8px 12px;font-family:inherit;font-size:14px;color:var(--ink)}
  .todaybox{margin-left:auto;background:var(--herb);color:#fff;border-radius:12px;padding:8px 16px;
    font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
  .todaybox b{font-family:'Fraunces',serif;font-weight:900}

  .tabs{display:flex;gap:6px;margin:22px 0 4px;flex-wrap:wrap}
  .tab{border:1.5px solid var(--line);background:var(--paper-2);border-radius:20px;padding:9px 18px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:all .15s}
  .tab:hover{border-color:var(--ink)}
  .tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* month nav */
  .monthbar{display:flex;align-items:center;gap:14px;margin:22px 0 12px}
  .monthbar h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(20px,3vw,28px);min-width:200px}
  .navbtn{border:1.5px solid var(--ink);background:var(--paper-2);width:38px;height:38px;border-radius:50%;
    cursor:pointer;font-size:17px;color:var(--ink);display:flex;align-items:center;justify-content:center;
    transition:all .15s;flex:none}
  .navbtn:hover{background:var(--ink);color:var(--paper)}
  .today-link{margin-left:auto;font-size:13px;font-weight:600;color:var(--herb);background:none;border:none;
    cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);
    text-align:center;padding:4px 0}
  .cell{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:7px 7px 6px;
    min-height:104px;cursor:pointer;transition:box-shadow .12s,transform .08s;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .cell:hover{box-shadow:0 3px 12px var(--shadow);transform:translateY(-1px)}
  .cell.blank{background:transparent;border:none;cursor:default;box-shadow:none;transform:none}
  .cell.muted{opacity:.4}
  .cell.past{opacity:.5}
  .cell.muted:hover{opacity:.7}
  .cell.today{border-color:var(--herb);box-shadow:0 0 0 2px rgba(47,107,74,.22)}
  .cell-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .cell-d{font-family:'Fraunces',serif;font-weight:900;font-size:17px;line-height:1}
  .cell.today .cell-d{color:var(--herb)}
  .pill{font-size:10px;font-weight:800;width:18px;height:18px;border-radius:5px;display:flex;
    align-items:center;justify-content:center;color:#fff;flex:none}
  .cook{position:absolute;top:6px;right:26px;font-size:11px}
  .meals{display:flex;flex-direction:column;gap:1px;font-size:10.5px;line-height:1.25;color:#463f34}
  .meals span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meals i,.meals em{font-style:normal}
  .meals i{margin-right:3px}
  .kcal{margin-top:auto;font-size:9.5px;font-weight:700;color:var(--ink-soft);letter-spacing:.03em;padding-top:3px}

  /* preps / weeks */
  .week{background:var(--paper-2);border:2px solid var(--ink);border-radius:18px;padding:20px;margin-bottom:20px}
  .week-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .week-h h3{font-family:'Fraunces',serif;font-weight:900;font-size:23px}
  .week-h .rng{font-size:13px;color:var(--ink-soft)}
  .cooksess{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 4px}
  .cooksess .c{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12.5px}
  .cooksess .c b{color:var(--herb-deep)}
  .prep-meals{font-size:12.5px;color:var(--ink-soft);margin:10px 0 14px;line-height:1.6}
  .prep-meals b{color:var(--ink);font-weight:600}
  .shop-h{display:flex;align-items:center;gap:10px;margin:8px 0 10px}
  .shop-h h4{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--herb)}
  .shop-h .cnt{font-size:11px;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-weight:600}
  .shop-grid{display:grid;gap:5px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .sitem{display:flex;align-items:center;gap:9px;padding:6px 9px;background:var(--paper);border:1px solid var(--line);border-radius:8px;cursor:pointer}
  .sitem.done{opacity:.55}
  .cbx{width:18px;height:18px;border:2px solid var(--ink-soft);border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;transition:all .12s}
  .sitem.done .cbx{background:var(--herb);border-color:var(--herb)}
  .cbx svg{opacity:0}.sitem.done .cbx svg{opacity:1}
  .sitem .nm{font-size:13px;flex:1}.sitem.done .nm{text-decoration:line-through}
  .sitem .amt{font-size:12.5px;font-weight:700;color:var(--herb-deep)}
  .sitem.done .amt{color:var(--ink-soft)}
  .extras{font-size:12px;color:var(--ink-soft);font-style:italic;margin-top:10px}

  /* recipes */
  .rgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .rsec-title{font-family:'Fraunces',serif;font-weight:900;font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
  .rsec-title:first-child{margin-top:6px}
  .rsec-title .line{flex:1;height:2px;background:var(--line)}
  .rcard{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 1px 0 var(--shadow)}
  .rcard h4{font-family:'Fraunces',serif;font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:8px;line-height:1.15}
  .rcard .macros{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .chip{font-size:11px;font-weight:700;border-radius:20px;padding:3px 10px;letter-spacing:.02em}
  .chip.k{background:#f3e6cf;color:#9a6a15}
  .chip.p{background:#dcecdf;color:var(--herb-deep)}
  .chip.c{background:#dbeaf2;color:var(--cold)}
  .ing{list-style:none;font-size:13px;color:#463f34;margin-bottom:12px}
  .ing li{display:flex;justify-content:space-between;padding:2.5px 0;border-bottom:1px dotted var(--line-soft)}
  .ing li b{font-weight:700;color:var(--ink)}
  .steps{list-style:none;counter-reset:s}
  .steps li{position:relative;padding-left:24px;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;counter-increment:s;line-height:1.4}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:17px;height:17px;background:var(--herb);
    color:#fff;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* modal */
  .ov{position:fixed;inset:0;background:rgba(33,31,26,.5);backdrop-filter:blur(3px);z-index:50;display:none;
    align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto}
  .ov.on{display:flex}
  .modal{background:var(--paper);border:2px solid var(--ink);border-radius:20px;max-width:560px;width:100%;
    padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
  .modal-h h3{font-family:'Fraunces',serif;font-weight:900;font-size:24px;line-height:1.05}
  .modal-h .sub{font-size:13px;color:var(--ink-soft);margin-top:2px}
  .xbtn{border:1.5px solid var(--ink);background:none;width:34px;height:34px;border-radius:50%;font-size:18px;
    cursor:pointer;flex:none;color:var(--ink);line-height:1}
  .xbtn:hover{background:var(--ink);color:var(--paper)}
  .daytot{display:flex;gap:8px;margin:14px 0 18px}
  .daytot .t{flex:1;background:var(--paper-2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .daytot .t .n{font-family:'Fraunces',serif;font-weight:900;font-size:22px;color:var(--herb)}
  .daytot .t .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
  .mrow{border-top:1px solid var(--line);padding:12px 0}
  .mrow .lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-soft);margin-bottom:2px}
  .mrow .mn{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .mrow .mk{font-size:11px;color:var(--ink-soft);font-weight:500;margin-left:auto}
  .mrow .mi{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.5}

  @media(max-width:640px){
    .todaybox{margin-left:0;width:100%;justify-content:center}
    #calHead,#calHeadH{display:none}
    .cal{grid-template-columns:1fr;gap:8px}
    .cell.blank,.cell.muted{display:none}
    .cell{min-height:auto;flex-direction:row;align-items:stretch;gap:12px;padding:12px 14px}
    .cell-top{flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;margin:0;min-width:44px}
    .cell-d{font-size:22px}
    .pill{width:24px;height:24px;font-size:12px}
    .cook{position:absolute;top:10px;right:12px;font-size:14px}
    .meals{flex-direction:column;flex-wrap:nowrap;gap:4px;margin-top:0;flex:1;font-size:14px;justify-content:center}
    .meals span{overflow:hidden;white-space:normal;text-overflow:clip}
    .meals em{display:inline}
    .meals i{font-size:16px;margin-right:6px}
    .kcal{display:none}
    /* hábitos em lista */
    .hcell{min-height:auto;flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
    .hcell .hd{font-size:20px;min-width:36px;text-align:center}
    .hchips{flex-direction:row;flex-wrap:wrap;gap:7px;margin-top:0;flex:1}
    .hchip{width:46px;height:46px;border-radius:50%;padding:0;justify-content:center}
    .hchip em{display:none}
    .hchip .ic{font-size:19px;margin:0}
    .hchips{gap:10px}
    .hg-h{min-width:88px}
    #view-habits .cal{grid-template-columns:repeat(3,1fr);gap:7px}
    #view-habits .hcell{flex-direction:column;align-items:stretch;gap:6px;padding:8px 8px 9px}
    #view-habits .hcell .hd{font-size:16px;min-width:0;text-align:left}
    #view-habits .hchips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
    #view-habits .hchip{width:auto;height:auto;border-radius:9px;padding:9px 0}
    #view-habits .hchip .ic{font-size:17px}
    .hcell.past{opacity:.5}
    .wklab{min-width:100px}
  }
  /* today panel */
  .today-panel{background:var(--ink);color:var(--paper);border-radius:18px;padding:18px 20px;margin-bottom:18px}
  .tp-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .tp-h .t{font-family:'Fraunces',serif;font-weight:900;font-size:20px}
  .tp-h .d{font-size:12px;opacity:.7;letter-spacing:.04em}
  .tp-meals{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .tp-m{background:rgba(244,239,227,.08);border:1px solid rgba(244,239,227,.14);border-radius:11px;padding:9px 11px}
  .tp-m .l{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;opacity:.6}
  .tp-m .n{font-size:13px;font-weight:600;margin-top:2px;line-height:1.2}
  .tp-m .k{font-size:10.5px;opacity:.6;margin-top:2px}
  .tp-cook{margin-top:12px;background:var(--herb);border-radius:11px;padding:10px 14px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tp-cook.soon{background:rgba(198,138,46,.9)}
  .tp-water{margin-top:12px;background:rgba(244,239,227,.08);border:1px solid rgba(244,239,227,.14);border-radius:11px;padding:11px 13px}
  .tw-h{font-size:13px;font-weight:600;margin-bottom:9px;opacity:.95}
  .tw-h b{font-family:'Fraunces',serif;font-size:16px;color:#7ecbe8;font-weight:900}
  .tw-h b.full{color:#8fdca0}
  .tw-range{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:6px;background:rgba(244,239,227,.14);outline:none;cursor:pointer}
  .tw-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #4aa3c9;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .tw-range::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #4aa3c9;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.35)}
  .tw-scale{display:flex;justify-content:space-between;font-size:10px;opacity:.5;margin-top:6px}

  /* cook mode + copy */
  .prep-actions{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
  .btn-s{border:1.5px solid var(--ink);background:var(--paper);border-radius:9px;padding:7px 13px;
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .13s}
  .btn-s:hover{background:var(--ink);color:var(--paper)}
  .btn-s.copied{background:var(--herb);border-color:var(--herb);color:#fff}
  .cook-mode{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .cook-mode.on{display:block}
  .ctl-head{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--herb);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ctl-head span{font-family:'Fraunces',serif;font-weight:900;text-transform:none;letter-spacing:0;color:var(--ink-soft);font-size:13px}
  .ctl-step{display:flex;gap:12px;padding-bottom:15px;position:relative}
  .ctl-step::before{content:'';position:absolute;left:23px;top:24px;bottom:0;width:2px;background:var(--line)}
  .ctl-step:last-child{padding-bottom:4px}
  .ctl-step:last-child::before{display:none}
  .ctl-t{flex:none;width:48px;height:24px;background:var(--herb);color:#fff;border-radius:12px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:1}
  .ctl-b{flex:1;padding-top:2px}
  .ctl-ti{font-weight:700;font-size:14px;margin-bottom:3px}
  .ctl-l{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:3px}
  .ctl-sep{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin:8px 0 12px;padding-top:12px;border-top:1px dashed var(--line)}
  .cook-meal{margin-bottom:14px}
  .cook-meal h5{font-family:'Fraunces',serif;font-weight:600;font-size:16px;margin-bottom:6px;display:flex;align-items:center;gap:7px}
  .cook-meal .bq{font-size:12.5px;color:var(--herb-deep);font-weight:600;margin-bottom:6px;line-height:1.5}
  .cook-meal ol{list-style:none;counter-reset:s}
  .cook-meal ol li{position:relative;padding-left:22px;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;counter-increment:s;line-height:1.4}
  .cook-meal ol li::before{content:counter(s);position:absolute;left:0;top:0;width:16px;height:16px;background:var(--herb);color:#fff;border-radius:50%;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}

  /* weight */
  .w-card{background:var(--paper-2);border:2px solid var(--ink);border-radius:18px;padding:20px;margin-bottom:18px}
  .w-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .w-add input{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px;color:var(--ink);outline:none}
  .w-add input:focus{border-color:var(--herb)}
  .w-add input[type=number]{width:110px}
  .w-add button{border:none;background:var(--herb);color:#fff;border-radius:10px;padding:11px 18px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .w-add button:hover{background:var(--herb-deep)}
  .w-verdict{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}
  .w-stat{flex:1;min-width:130px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
  .w-stat .n{font-family:'Fraunces',serif;font-weight:900;font-size:24px;color:var(--herb)}
  .w-stat .n.up{color:var(--herb)}.w-stat .n.down{color:#c0392b}.w-stat .n.flat{color:var(--amber)}
  .w-stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;margin-top:2px}
  .w-advice{background:#dcecdf;border:1px solid #bcd9c2;border-radius:12px;padding:12px 15px;font-size:13.5px;color:var(--herb-deep);margin-top:14px;line-height:1.5}
  .w-advice.warn{background:#f3e6cf;border-color:#e2cfa0;color:#8a5e14}
  .w-log{list-style:none;margin-top:16px;display:grid;gap:5px}
  .w-log li{display:flex;align-items:center;gap:10px;padding:8px 11px;background:var(--paper);border:1px solid var(--line);border-radius:9px;font-size:13.5px}
  .w-log li .wd{font-weight:700;font-family:'Fraunces',serif}
  .w-log li .wdate{color:var(--ink-soft);flex:1}
  .w-log li .wdel{margin-left:auto;background:none;border:none;color:#c1b9a6;cursor:pointer;font-size:17px}
  .w-log li .wdel:hover{color:#c0392b}
  .w-spark{margin-top:14px}
  .w-empty{color:var(--ink-soft);font-size:14px;font-style:italic;margin-top:14px}

  /* habits */
  .hbar{display:flex;align-items:center;gap:14px;margin:2px 0 12px;flex-wrap:wrap}
  .hbar h2{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(20px,3vw,28px);min-width:190px}
  .hlegend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .hleg{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:var(--paper-2);border:1px solid var(--line);border-radius:20px;padding:5px 13px}
  .hleg b{font-family:'Fraunces',serif;font-weight:900;color:var(--herb)}
  .hcell{background:var(--paper-2);border:1px solid var(--line);border-radius:11px;padding:6px 5px;min-height:96px;display:flex;flex-direction:column;gap:4px}
  .hcell.today{border-color:var(--herb);box-shadow:0 0 0 2px rgba(47,107,74,.22)}
  .hcell .hd{font-family:'Fraunces',serif;font-weight:900;font-size:15px;line-height:1}
  .hcell.today .hd{color:var(--herb)}
  .hchips{display:flex;flex-direction:column;gap:3px;margin-top:auto}
  .hchip{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;border-radius:6px;padding:3px 5px;cursor:pointer;background:var(--paper);border:1px solid var(--line);color:#b7ad98;transition:all .12s;user-select:none;white-space:nowrap;overflow:hidden}
  .hchip .ic{font-size:11px;filter:grayscale(1);opacity:.45}
  .hchip.on{color:#fff}
  .hchip.on .ic{filter:none;opacity:1}
  .hchip em{font-style:normal}
  .hchip.crea.on{background:var(--amber);border-color:var(--amber)}
  .hchip.multi.on{background:#7a5a9a;border-color:#7a5a9a}
  .hchip.gym.on{background:var(--herb);border-color:var(--herb)}
  .hchip.run.on{background:var(--cold);border-color:var(--cold)}
  /* weekly goals */
  .wk{background:var(--paper-2);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  .wk h3{font-family:'Fraunces',serif;font-weight:900;font-size:19px}
  .wk .sub{font-size:12px;color:var(--ink-soft);margin:1px 0 12px}
  .wk-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  .wk-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;align-items:center;gap:10px}
  .wk-item.met{border-color:var(--herb);background:#eef4ef}
  .wk-ic{font-size:20px}
  .wk-tx{flex:1;min-width:0}
  .wk-tx .n{font-weight:600;font-size:13.5px}
  .wk-tx .g{font-size:11px;color:var(--ink-soft)}
  .wk-cnt{font-family:'Fraunces',serif;font-weight:900;font-size:20px;color:var(--ink-soft)}
  .wk-item.met .wk-cnt{color:var(--herb)}
  .wk-cnt small{font-size:12px;color:var(--ink-soft);font-weight:400}
  .wkrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .wkrow:first-child{border-top:none}
  .wklab{font-size:12.5px;font-weight:600;min-width:120px;color:var(--ink-soft)}
  .wkrow.now .wklab{color:var(--herb)}
  .wkpills{display:flex;gap:6px;flex-wrap:wrap}
  .wp{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:20px;padding:4px 10px;background:var(--paper);border:1px solid var(--line);color:var(--ink-soft)}
  .wp.met{background:#eef4ef;border-color:var(--herb);color:var(--herb-deep)}
  /* esta semana (hero) */
  .hg{background:var(--paper-2);border:2px solid var(--ink);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  .hg-title{font-family:'Fraunces',serif;font-weight:900;font-size:19px}
  .hg-sub{font-size:12px;color:var(--ink-soft);margin:1px 0 10px}
  .hg-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .hg-row.hg-head{padding:2px 0 4px;border-top:none}
  .hg-h{display:flex;align-items:center;gap:8px;min-width:118px}
  .hg-ic{font-size:17px}
  .hg-nm{font-weight:600;font-size:13.5px}
  .hg-dots{display:flex;gap:5px;flex:1}
  .hg-wl{width:16px;text-align:center;font-size:9px;font-weight:700;color:var(--ink-soft);text-transform:uppercase}
  .hg-dot{width:16px;height:16px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line)}
  .hg-dot.on.crea{background:var(--amber);border-color:var(--amber)}
  .hg-dot.on.multi{background:#7a5a9a;border-color:#7a5a9a}

function dayInCycle(date){
  const ms=86400000;
  const a=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());
  const b=Date.UTC(start.getFullYear(),start.getMonth(),start.getDate());
  return (((Math.floor((a-b)/ms))%28)+28)%28+1;
}

function dayTotals(b){

}

  }catch(e){}
  if(!start){start=new Date(2026,8,5);}
  Object.values(habits).forEach(h=>{if(h.supp){h.crea=1;delete h.supp;}});
}
let sT;
function saveState(){

}

/* ============ FORMATAÇÃO QUANTIDADES ============ */
function fmt(a,u){
  if(a==='qb')return 'q.b.';
  if(u==='g'&&a>=1000)return (a/1000).toFixed(a%1000?1:0).replace('.',',')+' kg';
  if(u==='ml'&&a>=1000)return (a/1000).toFixed(a%1000?1:0).replace('.',',')+' L';
  if(u==='un')return a+'×';
  return a+(u?' '+u:'');
}

/* ============ PREPS & COMPRAS ============ */
function aggregate(blocks){
  const map={},extras=new Set();
  blocks.forEach(b=>{
    const port=b.hi-b.lo+1;
    [b.pa,b.al,b.la,b.ja].forEach(id=>{
      M[id].ing.forEach(([nm,a,u])=>{
        if(a==='qb'){extras.add(nm);return;}
        const key=nm+'|'+u;
        map[key]=map[key]||{nm,u,a:0};
        map[key].a+=a*port;
      });
    });
  });
  const list=Object.values(map).sort((x,y)=>x.nm.localeCompare(y.nm,'pt'));
  return {list,extras:[...extras]};
}

function copyPrep(id,btn){
  const b=BLOCKS.find(x=>x.id===id),port=b.hi-b.lo+1;
  const {list,extras}=aggregate([b]);
  let txt=`🛒 Compras — Prep ${id} (dias ${b.lo}–${b.hi}, ${port} doses)\n`;
  list.forEach(it=>{txt+=`• ${it.nm} — ${fmt(it.a,it.u)}\n`;});
  if(extras.length)txt+=`+ q.b.: ${extras.join(', ').toLowerCase()}, temperos.\n`;
  const done=()=>{const o=btn.textContent;btn.textContent='✅ Copiado!';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=o;btn.classList.remove('copied');},1500);};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,cb){
  const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();try{document.execCommand('copy');cb();}catch(e){}document.body.removeChild(ta);
}

/* ============ PESO ============ */
function weekChange(){
  if(weights.length<2)return null;
  const s=[...weights].sort((a,b)=>a.d.localeCompare(b.d));
  const first=s[0],last=s[s.length-1];
  const days=(new Date(last.d)-new Date(first.d))/86400000;
  if(days<3)return null;
  return {perWeek:(last.kg-first.kg)/(days/7),days,last:last.kg,first:first.kg};
}
function renderWeight(){
  const wrap=document.getElementById('view-weight');
  const c=weekChange();
  let verdict='',advice='';
  if(c){
    const pw=c.perWeek;
    const cls=pw>0.05?'up':pw<-0.05?'down':'flat';
    const sign=pw>0?'+':'';
    verdict=`<div class="w-verdict">
      <div class="w-stat"><div class="n ${cls}">${sign}${pw.toFixed(2)} kg</div><div class="l">por semana</div></div>
      <div class="w-stat"><div class="n">${c.last.toFixed(1)}</div><div class="l">peso atual (kg)</div></div>
      <div class="w-stat"><div class="n">${(c.last-c.first>=0?'+':'')+(c.last-c.first).toFixed(1)}</div><div class="l">total (${Math.round(c.days)} dias)</div></div></div>`;
    if(pw>=0.2&&pw<=0.5){advice=`<div class="w-advice">✅ Estás a subir ${pw.toFixed(2)} kg/semana — dentro do alvo (0,2–0,3). Mantém as ~3.000 kcal, não mexas.</div>`;}
    else if(pw>0.5){advice=`<div class="w-advice warn">⬆️ A subir >0,5 kg/semana. Tira ~150–200 kcal/dia (menos arroz/batata num prato).</div>`;}
    else if(pw<0.2){advice=`<div class="w-advice warn">➡️ Não estás a ganhar o suficiente. Se se mantiver 2–3 semanas, sobe para ~3.150–3.200 kcal/dia.</div>`;}
    advice+=`<div class="w-advice" style="background:#eee6d6;border-color:#ddd0b5;color:#6b6558;margin-top:8px">💧 Se começaste creatina há pouco, ignora o salto inicial da balança — é água, não gordura.</div>`;
  }else{
    advice=`<div class="w-empty">Regista o peso 2–3× por semana (de manhã, em jejum). Com ~1 semana de dados mostro-te a tendência e se deves ajustar as calorias.</div>`;
  }
  // sparkline
  let spark='';
  if(weights.length>=2){
    const s=[...weights].sort((a,b)=>a.d.localeCompare(b.d));
    const kgs=s.map(x=>x.kg),mn=Math.min(...kgs),mx=Math.max(...kgs),rng=(mx-mn)||1;
    const W=Math.min(560,s.length*60),H=90;
    const pts=s.map((x,i)=>`${(i/(s.length-1))*W},${H-8-((x.kg-mn)/rng)*(H-20)}`).join(' ');
    spark=`<div class="w-spark"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="var(--herb)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${s.map((x,i)=>`<circle cx="${(i/(s.length-1))*W}" cy="${H-8-((x.kg-mn)/rng)*(H-20)}" r="3" fill="var(--herb)"/>`).join('')}
    </svg></div>`;
  }
  const log=weights.length?[...weights].sort((a,b)=>b.d.localeCompare(a.d)).map(x=>{
    const [y,m,d]=x.d.split('-');
    return `<li><span class="wd">${x.kg.toFixed(1)} kg</span><span class="wdate">${d}/${m}/${y}</span>
      <button class="wdel" data-del="${x.d}">×</button></li>`;
  }).join(''):'';
  wrap.innerHTML=`<div class="w-card">
    <div class="w-add">
      <input type="date" id="wDate"><input type="number" id="wKg" placeholder="kg" step="0.1" inputmode="decimal">
      <button id="wAdd">Registar</button>
    </div>
    ${verdict}${advice}${spark}
    ${log?`<ul class="w-log">${log}</ul>`:''}
  </div>`;
  document.getElementById('wDate').value=isoOf(today);
  document.getElementById('wAdd').onclick=()=>{
    const d=document.getElementById('wDate').value, kg=parseFloat(document.getElementById('wKg').value);
    if(!d||!kg||kg<=0)return;
    weights=weights.filter(x=>x.d!==d); weights.push({d,kg});
    saveState(); renderWeight();
  };
  wrap.querySelectorAll('[data-del]').forEach(btn=>btn.onclick=()=>{
    weights=weights.filter(x=>x.d!==btn.dataset.del); saveState(); renderWeight();
  });
}

      const on=!!h[k]; if(on)cnt++; dots.push(`<span class="hg-dot ${k}${on?' on':''}"></span>`);}
    const met=cnt>=goal;
    return `<div class="hg-row${met?' met':''}"><div class="hg-h"><span class="hg-ic">${e}</span><span class="hg-nm">${label}</span></div>`+
      `<div class="hg-dots">${dots.join('')}</div><span class="hg-ct">${cnt}/${mx}${met?' ✅':''}</span></div>`;
  }).join('');
  const mob=window.matchMedia('(max-width:640px)').matches;
  const curM=today.getFullYear()===y&&today.getMonth()===m;
  const hcell=(d,past)=>{
    const iso=isoOf(new Date(y,m,d)),h=habits[iso]||{};
    const tod=(curM&&today.getDate()===d)?' today':'';
    const chips=HAB.map(([k,e,label])=>`<span class="hchip ${k}${h[k]?' on':''}" data-i="${iso}" data-h="${k}"><span class="ic">${e}</span><em>${label}</em></span>`).join('');
    return `<div class="hcell${tod}${past?' past':''}"><span class="hd">${d}</span><div class="hchips">${chips}</div></div>`;
  };
  let cells='';
  if(mob&&curM){
    for(let d=today.getDate();d<=n;d++)cells+=hcell(d,false);
    for(let d=1;d<today.getDate();d++)cells+=hcell(d,true);
  }else{
    for(let i=0;i<off;i++)cells+='<div class="cell blank"></div>';
    for(let d=1;d<=n;d++)cells+=hcell(d,false);
  }
  const streakOf=k=>{let c=0,d=new Date(today.getFullYear(),today.getMonth(),today.getDate());while((habits[isoOf(d)]||{})[k]){c++;d.setDate(d.getDate()-1);}return c;};
  const monthCount=k=>{let c=0;for(let dd=1;dd<=n;dd++){if((habits[isoOf(new Date(y,m,dd))]||{})[k])c++;}return c;};
  const hstats=`<div class="hstats">`+HAB.map(([k,e,label])=>`<div class="hst"><span class="hst-e">${e}</span><div><div class="hst-s">🔥 ${streakOf(k)}</div><div class="hst-l">${label} · ${monthCount(k)} este mês</div></div></div>`).join('')+`</div>`;
  wrap.innerHTML=`
    <div class="hg"><div class="hg-title">🎯 Esta semana</div>
      <div class="hg-sub">${fmtD(wm)}–${fmtD(wsun)} · 💊🌿 todos os dias · 🏋️ 5–6 · 🏃 1–2</div>
      <div class="hg-row hg-head"><div class="hg-h"></div><div class="hg-dots">${heads}</div><span class="hg-ct" style="visibility:hidden">0/0</span></div>
      ${rows}</div>
    ${hstats}
    <div class="hbar"><button class="navbtn" id="hprev">‹</button>
      <h2>${MONTHS[m]} ${y}</h2>
      <button class="navbtn" id="hnext">›</button>
      <button class="today-link" id="hToday">hoje</button></div>
    <div class="cal" id="calHeadH"></div>
    <div class="cal" style="margin-top:8px">${cells}</div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:12px">Toca nos ícones de cada dia para marcar.</p>`;
  const hh=document.getElementById('calHeadH');
  WD.forEach(w=>{const e=document.createElement('div');e.className='cal-h';e.textContent=w;hh.appendChild(e);});
  document.getElementById('hprev').onclick=()=>{hview.setMonth(m-1);renderHabits();};
  document.getElementById('hnext').onclick=()=>{hview.setMonth(m+1);renderHabits();};
  document.getElementById('hToday').onclick=()=>{hview=new Date();hview.setDate(1);renderHabits();};
  wrap.querySelectorAll('.hchip').forEach(ch=>ch.onclick=()=>{
    const i=ch.dataset.i,k=ch.dataset.h;
    habits[i]=habits[i]||{};
    if(habits[i][k]){delete habits[i][k];} else {habits[i][k]=1;}
    if(!Object.keys(habits[i]).length)delete habits[i];
    saveState(); renderHabits();
  });
}

/* ============ BACKUP / TIMER ============ */
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;o.start();g.gain.setValueAtTime(.0001,a.currentTime);g.gain.exponentialRampToValueAtTime(.4,a.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.7);o.stop(a.currentTime+.75);}catch(e){}}
function exportData(){
  const data={start:isoOf(start),checks,weights,habits,water,v:2};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='meal-prep-backup-'+isoOf(today)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function importData(file){
  const rd=new FileReader();
  rd.onload=()=>{try{
    const s=JSON.parse(rd.result);
    if(s.start)start=new Date(s.start);
    if(s.checks)checks=s.checks;if(s.weights)weights=s.weights;
    if(s.habits)habits=s.habits;if(s.water)water=s.water;
    saveState();
    document.getElementById('start').value=isoOf(start);
    renderCal();renderToday();renderPrep();renderRec();renderWeight();renderHabits();
    alert('Backup importado ✅');
  }catch(e){alert('Ficheiro inválido.');}};
  rd.readAsText(file);
}

/* ============ NAV / TABS ============ */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  const v=t.dataset.v;
  document.getElementById('view-cal').style.display=v==='cal'?'':'none';
  document.getElementById('view-prep').style.display=v==='prep'?'':'none';
  document.getElementById('view-rec').style.display=v==='rec'?'':'none';
  document.getElementById('view-weight').style.display=v==='weight'?'':'none';
  document.getElementById('view-habits').style.display=v==='habits'?'':'none';
  if(v==='weight')renderWeight();
  if(v==='habits')renderHabits();
}));
document.getElementById('prev').addEventListener('click',()=>{view.setMonth(view.getMonth()-1);renderCal();});
document.getElementById('next').addEventListener('click',()=>{view.setMonth(view.getMonth()+1);renderCal();});
document.getElementById('goToday').addEventListener('click',()=>{view=new Date();view.setDate(1);renderCal();});
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{renderCal();if(document.getElementById('view-habits').style.display!=='none')renderHabits();},200);});
document.getElementById('start').addEventListener('change',e=>{
  const [y,m,d]=e.target.value.split('-').map(Number);
  start=new Date(y,m-1,d); saveState(); renderCal();
});

/* ============ INIT ============ */
(function(){
  loadState();
  document.getElementById('start').value=isoOf(start);
  renderCal(); renderToday(); renderPrep(); renderRec();
  document.getElementById('view-prep').addEventListener('click',onShopClick);
  document.getElementById('expBtn').onclick=exportData;
  document.getElementById('impBtn').onclick=()=>document.getElementById('impFile').click();
  document.getElementById('impFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value='';};
})();
</script>
</body>
